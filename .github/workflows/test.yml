name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD
    timeout-minutes: 30
    steps:
    - name: checkout code
      uses: actions/checkout@v4
      with:
        path: mruby-jail

    - name: checkout mruby
      uses: actions/checkout@v4
      with:
        repository: mruby/mruby
        path: mruby
        ##
        # The full history is needed when build.rb.lock pins mruby to a
        # commit that is not the tip of the default branch
        fetch-depth: 0

    - name: Build and test
      uses: vmactions/freebsd-vm@v1
      with:
        copyback: false
        envs: GITHUB_WORKSPACE
        run: |
          set -e

          ##
          # Install what the base system does not already provide
          command -v git >/dev/null 2>&1 || pkg-static install -y git
          command -v ruby >/dev/null 2>&1 || pkg-static install -y ruby

          ##
          # The workspace is owned by the runner user, but the commands
          # below run as root inside the VM
          git config --global --add safe.directory "$GITHUB_WORKSPACE/mruby"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/mruby-jail"

          uname -a
          id
          ruby -v
          git --version

          ##
          # Pin mruby to the commit recorded by build.rb.lock, when that
          # file is available. It is a generated file, and it is ignored
          # by .gitignore, so it is usually absent
          lock="$GITHUB_WORKSPACE/mruby-jail/build.rb.lock"
          if [ -f "$lock" ]; then
            commit=$(sed -n 's/^  git_commit: //p' "$lock")
            echo "mruby commit: $commit"
            git -C "$GITHUB_WORKSPACE/mruby" checkout --detach "$commit"
          else
            echo "build.rb.lock is not available; using mruby's default branch"
          fi

          cd "$GITHUB_WORKSPACE/mruby-jail"
          make MRUBY_DIR="$GITHUB_WORKSPACE/mruby"
