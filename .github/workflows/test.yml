name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD
    timeout-minutes: 30
    steps:
    - name: checkout code
      uses: actions/checkout@v4
      with:
        path: mruby-jail

    - name: checkout mruby
      uses: actions/checkout@v4
      with:
        repository: mruby/mruby
        path: mruby
        ##
        # The full history is needed to check out the commit that
        # build.rb.lock is pinned to
        fetch-depth: 0

    - name: read the locked mruby commit
      run: |
        commit=$(sed -n 's/^  git_commit: //p' mruby-jail/build.rb.lock)
        echo "mruby commit: $commit"
        echo "MRUBY_COMMIT=$commit" >> "$GITHUB_ENV"

    - name: Build and test
      uses: vmactions/freebsd-vm@v1
      with:
        copyback: false
        envs: GITHUB_WORKSPACE,MRUBY_COMMIT
        run: |
          set -e

          ##
          # Install what the base system does not already provide
          command -v git >/dev/null 2>&1 || pkg-static install -y git
          command -v ruby >/dev/null 2>&1 || pkg-static install -y ruby

          ##
          # The workspace is owned by the runner user, but the commands
          # below run as root inside the VM
          git config --global --add safe.directory "$GITHUB_WORKSPACE/mruby"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/mruby-jail"

          uname -a
          id
          ruby -v
          git --version

          git -C "$GITHUB_WORKSPACE/mruby" checkout --detach "$MRUBY_COMMIT"
          cd "$GITHUB_WORKSPACE/mruby-jail"
          make MRUBY_DIR="$GITHUB_WORKSPACE/mruby"
