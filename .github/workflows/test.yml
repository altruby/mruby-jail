name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  ##
  # mruby is pinned to the commit that build.rb.lock records. Do not
  # float on mruby's default branch: it ships a core "mruby-process"
  # gem that shadows 0x1eef/mruby-process, which drops Process.euid,
  # and Process.euid is what Jail::Test.root? uses to decide whether
  # the specs can run
  MRUBY_REF: 1f3f28bfb0d974238d64aa2652e064786dff5ec7

jobs:
  freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD
    timeout-minutes: 30
    steps:
    - name: checkout code
      uses: actions/checkout@v4
      with:
        path: mruby-jail

    - name: checkout mruby
      uses: actions/checkout@v4
      with:
        repository: mruby/mruby
        ref: ${{ env.MRUBY_REF }}
        path: mruby

    - name: Build and test
      uses: vmactions/freebsd-vm@v1
      with:
        copyback: false
        envs: GITHUB_WORKSPACE
        run: |
          set -e

          ##
          # Install what the base system does not already provide.
          # mruby's minirake is a thin wrapper around rake
          command -v git >/dev/null 2>&1 || pkg-static install -y git
          command -v ruby >/dev/null 2>&1 || pkg-static install -y ruby
          command -v rake >/dev/null 2>&1 || pkg-static install -y rubygem-rake

          ##
          # The workspace is owned by the runner user, but the commands
          # below run as root inside the VM
          git config --global --add safe.directory "$GITHUB_WORKSPACE/mruby"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/mruby-jail"

          uname -a
          id
          ruby -v
          git --version

          ##
          # The specs create and remove jails, so they only run as root
          if [ "$(id -u)" -ne 0 ]; then
            echo "error: the jail specs must run as root" >&2
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/mruby-jail"
          make MRUBY_DIR="$GITHUB_WORKSPACE/mruby" toolchain
          bin/mruby -e 'p Jail::VERSION'
          bin/mruby -e 'p Process.euid'
          make MRUBY_DIR="$GITHUB_WORKSPACE/mruby" test
